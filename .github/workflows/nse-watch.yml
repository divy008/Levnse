name: NSE & BSE Watch - Daily Announcements

permissions:
  contents: write

on:
  repository_dispatch:
    types: [cron-trigger]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nse-watch
      cancel-in-progress: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 1  # 👈 આનાથી 21 સેકન્ડનો સમય ઘટીને 1-2 સેકન્ડ થઈ જશે

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install feedparser requests openpyxl python-dateutil

    - name: Run NSE Watch Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
      run: |
        python fetch_and_notify.py

    - name: Run BSE Watch Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python bse_monitor.py

    - name: Commit and push changes
      if: always()  # 👈 જો કોઈ એક સ્ક્રિપ્ટમાં પ્રોબ્લેમ આવે તો પણ જે સ્ક્રિપ્ટનો ડેટા આવ્યો હોય તે સેવ થશે
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add announcements.db announcements.xlsx run_log.txt bse_announcements.db bse_announcements.xlsx bse_run_log.txt bse_bot.log || true
        if ! git diff --staged --quiet; then
          git commit -m "🔄 Auto-update: NSE & BSE announcements [skip ci]"
          git push origin HEAD
        fi
        
