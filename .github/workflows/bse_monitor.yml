name: BSE Announcement Monitor

on:
  repository_dispatch:
    types: [trigger-bse-check]
  workflow_dispatch:

jobs:
  run-bse-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore BSE Database Cache
        uses: actions/cache@v4
        with:
          path: bse_announcements.db
          key: bse-db-${{ github.run_id }}
          restore-keys: |
            bse-db-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests python-dateutil openpyxl

      - name: Run BSE Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_SOURCE: "cronjobs.org"
        run: |
          python bse_monitor.py

      - name: Save BSE Database Cache
        uses: actions/cache@v4
        with:
          path: bse_announcements.db
          key: bse-db-${{ github.run_id }}
